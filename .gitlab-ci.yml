stages:
  - build
  - deploy

variables:
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

build-job:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -t $IMAGE_TAG ./Backend/
    - docker push $IMAGE_TAG

deploy-prod:
  stage: deploy
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker pull $IMAGE_TAG
    # Aquí podrías hacer el despliegue real, por ejemplo vía SSH
    # - ssh usuario@servidor "docker run -d --restart always $IMAGE_TAG"
  environment:
    name: development

