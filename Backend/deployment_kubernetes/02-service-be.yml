apiVersion: v1
kind: Service
metadata:
  name: svc-backend
  namespace: clipextract-backend
spec:
  selector:
    app: clipextract-backend
  ports:
    - protocol: TCP
      port: 50010         # Puerto interno del Service
      targetPort: 50010   # Puerto del contenedor
      nodePort: 30080     # Puerto en el nodo para exponer 
  type: NodePort
