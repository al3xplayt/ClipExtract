apiVersion: apps/v1
kind: Deployment
metadata:
  name: clipextract-postgresql
  namespace: clipextract-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clipextract-postgresql
  template:
    metadata:
      labels:
        app: clipextract-postgresql
    spec:
      containers:
        - name: clipextract-postgresql-pod
          image: postgres:latest
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: password
            - name: POSTGRES_DB
              value: "clipextract_db"
          volumeMounts:
            - name: postgresql-data
              mountPath: /var/lib/postgresql/data
            - name: init-db
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: postgresql-data
          persistentVolumeClaim:
            claimName: postgresql-pvc
        - name: init-db
          configMap:
            name: init-db-script

