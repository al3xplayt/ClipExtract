pluginManagement {
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
        // (opcional) Si quieres permitir plugins desde JitPack también
        maven { url 'https://jitpack.io' }
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // 👇 Esta línea es necesaria para dependencias como RangeBar
        maven { url 'https://jitpack.io' }
    }
}

rootProject.name = "trabajoFinal_AG"
include ':app'
